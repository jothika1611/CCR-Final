version: '3.8'

services:
  qdrant_db:
    image: qdrant/qdrant:latest
    container_name: compliance-engine-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  engine_backend:
    build: .
    container_name: compliance-engine-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/compliance_app
      - embedding_cache:/root/.cache/huggingface
    env_file:
      - .env
    depends_on:
      - qdrant_db
    restart: unless-stopped

volumes:
  qdrant_storage:
  embedding_cache:
